name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: App (lint · typecheck · test · build)
    runs-on: ubuntu-latest
    env:
      # Claves locales/demo públicas (sujetas a RLS); sólo para que el build no falle.
      VITE_SUPABASE_URL: http://127.0.0.1:54521
      VITE_SUPABASE_ANON_KEY: anon-placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Guardia de variables de entorno
        run: pnpm check:env
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  database:
    name: Base de datos (migraciones · pgTAP · RLS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Levantar Supabase local
        run: supabase start
      - name: Pruebas pgTAP (RLS, roles, RPC)
        run: supabase test db
      - name: Detener Supabase
        if: always()
        run: supabase stop

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
